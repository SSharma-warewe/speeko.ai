services:
  postgres:
    image: postgres:16-alpine
    container_name: call-agent-postgres
    ports:
      - '5432:5432'
    environment:
      POSTGRES_USER: callagent
      POSTGRES_PASSWORD: callagent
      POSTGRES_DB: callagent
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U callagent -d callagent']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
